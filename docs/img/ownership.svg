<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">Who decides what</title>
<desc id="d">Eight decisions in a trade, and who makes each one. In the pilot fund, Claude only formed beliefs; Python or a human picked markets, decided whether to trade, sized bets, wrote the strategy and built the tools. In the benchmark the agent does all of those, and the exchange only fills orders, charges fees, values positions, keeps the ledger and scores.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1C1E26}
.bg{fill:#FAF9F6}.card{fill:#FFFFFF;stroke:#E4E2DC}
.h{font-size:17px;font-weight:650}.b{font-size:14px;font-weight:650}.s{font-size:12.5px}.xs{font-size:11px}.m{fill:#63635E}.f{fill:#9A988F}
.n{font-variant-numeric:tabular-nums}
.grid{stroke:#E4E2DC}.axis{stroke:#9A988F}
.v1{stroke:#2E7D9A}.v1f{fill:#2E7D9A}.v2{stroke:#B4572E}.v2f{fill:#B4572E}.ctl{stroke:#9A988F}.ctlf{fill:#9A988F}
.bench{fill:#0F5C4A}.benchl{stroke:#0F5C4A}.live{fill:#0F5C4A;fill-opacity:.08}
.era{fill:#EDECE7}.chip{fill:#FFFFFF;font-size:12px;font-weight:600}
.agent{fill:#0F5C4A}.harness{fill:#9A988F}.human{fill:#2547B8}
.gain{fill:#15803D}.loss{fill:#B91C1C}
@media (prefers-color-scheme:dark){
text{fill:#EEEEEC}.bg{fill:#111110}.card{fill:#191918;stroke:#2A2A28}.m{fill:#B5B3AD}.f{fill:#7C7A74}
.grid{stroke:#2A2A28}.axis{stroke:#7C7A74}
.v1{stroke:#5FB7D4}.v1f{fill:#5FB7D4}.v2{stroke:#E08A5F}.v2f{fill:#E08A5F}.ctl{stroke:#8A8880}.ctlf{fill:#8A8880}
.bench{fill:#4FB59A}.benchl{stroke:#4FB59A}.live{fill:#4FB59A;fill-opacity:.12}
.era{fill:#222220}.chip{fill:#111110}
.agent{fill:#4FB59A}.harness{fill:#8A8880}.human{fill:#7C9CF5}
.gain{fill:#4ADE80}.loss{fill:#F87171}}
</style>
<rect class="bg" width="900" height="400" rx="12"/>
<text x="24" y="36" class="h">Who decides what</text>
<text x="24" y="58" class="s m">The pilot fund scored my rules. The benchmark scores the agent, and the harness only does what a real exchange does.</text>
<text x="520" y="96" text-anchor="middle" class="b">Pilot fund</text>
<text x="520" y="112" text-anchor="middle" class="xs m">Aug – Oct 2026</text>
<text x="740" y="96" text-anchor="middle" class="b">Benchmark</text>
<text x="740" y="112" text-anchor="middle" class="xs m">Oct 27 onward</text>
<rect class="card" x="24" y="117" width="852" height="30" rx="6"/>
<text x="40" y="137" class="s">Picks which markets to research</text>
<rect class="harness" x="493.4" y="123" width="53.2" height="22" rx="11"/>
<text x="520" y="138" text-anchor="middle" class="chip">Python</text>
<rect class="agent" x="702.6" y="123" width="74.8" height="22" rx="11"/>
<text x="740" y="138" text-anchor="middle" class="chip">the agent</text>
<text x="40" y="167" class="s">Forms a belief about each market</text>
<rect class="agent" x="493.4" y="153" width="53.2" height="22" rx="11"/>
<text x="520" y="168" text-anchor="middle" class="chip">Claude</text>
<rect class="agent" x="702.6" y="153" width="74.8" height="22" rx="11"/>
<text x="740" y="168" text-anchor="middle" class="chip">the agent</text>
<rect class="card" x="24" y="177" width="852" height="30" rx="6"/>
<text x="40" y="197" class="s">Decides whether to trade</text>
<rect class="harness" x="493.4" y="183" width="53.2" height="22" rx="11"/>
<text x="520" y="198" text-anchor="middle" class="chip">Python</text>
<rect class="agent" x="702.6" y="183" width="74.8" height="22" rx="11"/>
<text x="740" y="198" text-anchor="middle" class="chip">the agent</text>
<text x="40" y="227" class="s">Sizes the bet</text>
<rect class="harness" x="493.4" y="213" width="53.2" height="22" rx="11"/>
<text x="520" y="228" text-anchor="middle" class="chip">Python</text>
<rect class="agent" x="702.6" y="213" width="74.8" height="22" rx="11"/>
<text x="740" y="228" text-anchor="middle" class="chip">the agent</text>
<rect class="card" x="24" y="237" width="852" height="30" rx="6"/>
<text x="40" y="257" class="s">Writes the strategy and the instructions</text>
<rect class="human" x="507.8" y="243" width="24.4" height="22" rx="11"/>
<text x="520" y="258" text-anchor="middle" class="chip">Me</text>
<rect class="agent" x="702.6" y="243" width="74.8" height="22" rx="11"/>
<text x="740" y="258" text-anchor="middle" class="chip">the agent</text>
<text x="40" y="287" class="s">Builds the tools it uses</text>
<rect class="human" x="507.8" y="273" width="24.4" height="22" rx="11"/>
<text x="520" y="288" text-anchor="middle" class="chip">Me</text>
<rect class="agent" x="702.6" y="273" width="74.8" height="22" rx="11"/>
<text x="740" y="288" text-anchor="middle" class="chip">the agent</text>
<rect class="card" x="24" y="297" width="852" height="30" rx="6"/>
<text x="40" y="317" class="s">Fills orders, charges fees, values positions</text>
<rect class="harness" x="493.4" y="303" width="53.2" height="22" rx="11"/>
<text x="520" y="318" text-anchor="middle" class="chip">Python</text>
<rect class="harness" x="691.8" y="303" width="96.4" height="22" rx="11"/>
<text x="740" y="318" text-anchor="middle" class="chip">the exchange</text>
<text x="40" y="347" class="s">Keeps the ledger and scores the result</text>
<rect class="harness" x="493.4" y="333" width="53.2" height="22" rx="11"/>
<text x="520" y="348" text-anchor="middle" class="chip">Python</text>
<rect class="harness" x="691.8" y="333" width="96.4" height="22" rx="11"/>
<text x="740" y="348" text-anchor="middle" class="chip">the exchange</text>
<text x="24" y="386" class="xs f">In the pilot, Claude made one of the eight calls. In the benchmark it makes six, and can rewrite how it makes them between sessions.</text>
</svg>