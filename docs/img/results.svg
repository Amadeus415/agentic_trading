<title id="t">Nightshift v0.1 results</title>
<desc id="d">Account value of six $1,000 paper accounts over 28 days, October 27 to November 24, 2026. Evolving 1 ended at $2,365 and Evolving 2 at $1,632. Frozen 2 ended at $969 and Frozen 1 at $750. The random baseline ended at $741, the favorites baseline at $389, and the S&amp;P 500 over the same window at $944. Both evolving agents jumped on day one when a Visa earnings bet placed in their first session paid out.</desc>
