<title id="t">How Nightshift got here</title>
<desc id="d">Three panels. First, a paper fund I designed traded stocks, crypto and prediction markets from August 22 to October 5, 2026 and ended up 2 percent after a 27 percent drawdown. Second, a fund that traded prediction markets only, sizing Claude's forecasts with Kelly, went from 1,000 to a peak of 1,176 dollars on October 21 and ended at 426 dollars on October 26, down 57 percent, while a code-only control fund lost 8 percent. Third, the benchmark: six accounts live from October 27 to November 24, with results published every 15 minutes.</desc>
