    </g>
    <text x="88" y="190" font-size="11" letter-spacing="2" fill="#71998c">FUND</text>
    <g font-size="17" fill="#9dbbb1"><rect x="76" y="207" width="206" height="48" rx="9" fill="#1b493d"/><circle cx="102" cy="231" r="7" fill="#58d29a"/><text x="124" y="237" fill="#fff" font-weight="700">Overview</text><text x="101" y="291">◫</text><text x="124" y="291">Portfolio</text><text x="101" y="341">↗</text><text x="124" y="341">Trades</text></g>
    <text x="88" y="405" font-size="11" letter-spacing="2" fill="#71998c">OPERATIONS</text>
    <g font-size="17" fill="#9dbbb1"><text x="101" y="454">◷</text><text x="124" y="454">Agent runs</text><text x="101" y="504">◇</text><text x="124" y="504">System &amp; method</text></g>
    <rect x="77" y="670" width="207" height="153" rx="14" fill="#123c32" stroke="#2b594d"/>
    <circle cx="100" cy="703" r="7" fill="#58d29a"/><text x="119" y="708" font-size="12" letter-spacing="1.5" fill="#dce9e5">SYSTEM READY</text>
    <text x="94" y="747" font-size="11" fill="#789e92">MODE</text><text x="244" y="747" text-anchor="end" font-size="12" fill="#fff">SHADOW</text>
