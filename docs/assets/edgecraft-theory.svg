    <line x1="385" y1="724" x2="1458" y2="724" stroke="#ecefea"/>
    <g font-size="14" fill="#17362d"><circle cx="400" cy="756" r="16" fill="#fff0d5"/><text x="400" y="761" text-anchor="middle" font-size="10" font-weight="800" fill="#a76700">VTI</text><text x="430" y="761" font-weight="700">VTI</text><text x="620" y="761">Hold · spread gate</text><text x="835" y="761">$0.00</text><rect x="1025" y="742" width="118" height="28" rx="14" fill="#fff0d5"/><circle cx="1045" cy="756" r="5" fill="#d58b17"/><text x="1058" y="761" font-size="11" fill="#8b5a08">HELD SAFE</text><text x="1285" y="761" fill="#6d7972">Yesterday, 7:40 AM</text></g>

    <text x="800" y="833" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#b7cdc5">SYNTHETIC PREVIEW · THE RUNNING DASHBOARD READS YOUR LOCAL AUDIT LEDGER</text>
