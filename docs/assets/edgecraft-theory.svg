<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Edgecraft interactive operator dashboard preview</title>
  <desc id="desc">A colorful synthetic preview of the Edgecraft read-only operator dashboard showing portfolio value, autonomy health, recent trades, and policy controls.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071c18"/><stop offset="1" stop-color="#12392f"/></linearGradient>
    <linearGradient id="chart" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#54d69a" stop-opacity=".42"/><stop offset="1" stop-color="#54d69a" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#00110d" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#page)"/>
  <circle cx="1435" cy="90" r="250" fill="#f2b84b" opacity=".12"/><circle cx="1295" cy="830" r="330" fill="#48c9ff" opacity=".08"/>

  <g filter="url(#shadow)">
    <rect x="55" y="48" width="1490" height="804" rx="24" fill="#f4f2e9"/>
    <rect x="55" y="48" width="252" height="804" rx="24" fill="#0d3028"/>
    <rect x="283" y="48" width="24" height="804" fill="#0d3028"/>
  </g>

