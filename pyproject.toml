[project]
name = "edgecraft"
version = "0.6.0"
description = "Autonomous, policy-gated portfolio management and causal stock research"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.11,<3",
  "scipy>=1.15,<2",
  "yfinance>=0.2.65,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
edgecraft = "edgecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgecraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
