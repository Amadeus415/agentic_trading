[project]
name = "edgecraft"
version = "0.1.0"
description = "Point-in-time, adversarially validated stock strategy research suite"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "uvicorn[standard]>=0.35,<1",
  "yfinance>=0.2.65,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgecraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
