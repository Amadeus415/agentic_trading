[project]
name = "edgecraft"
version = "2.0.0"
description = "An autonomous prediction-market paper fund with preserved history and code provenance"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = [
  "autonomous-agents",
  "kalshi",
  "llm-agents",
  "paper-trading",
  "polymarket",
  "prediction-markets",
  "portfolio-management",
  "quantitative-finance",
  "trading-simulation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/Amadeus415/agentic_trading"
Documentation = "https://github.com/Amadeus415/agentic_trading#readme"
Issues = "https://github.com/Amadeus415/agentic_trading/issues"
Source = "https://github.com/Amadeus415/agentic_trading"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
edgecraft = "edgecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgecraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
