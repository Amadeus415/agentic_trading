[project]
name = "nightshift"
version = "0.1.0"
description = "A live benchmark: can AI agents make money trading prediction markets, and improve by rewriting their own code?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = ["agents", "benchmark", "kalshi", "llm", "polymarket", "prediction-markets", "self-improvement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Amadeus415/agentic_trading"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.12,<1"]

[project.scripts]
nightshift = "nightshift.cli:main"
ns = "nightshift.ns:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
